name: Build AnimeJL

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build AnimeJL
        run: ./gradlew :src:es:animejl:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: animejl-apk
          path: |
            **/build/outputs/apk/**/*.apk